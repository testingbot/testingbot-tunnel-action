version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          dev-dependencies:
              dependency-type: development
              update-types: [minor, patch]
      ignore:
          # v3+ is ESM-only; needs the bundler changes before it can be updated.
          - dependency-name: '@actions/artifact'
            update-types: [version-update:semver-major]
          # typescript-eslint supports TypeScript < 6.1 only.
          - dependency-name: typescript
            update-types: [version-update:semver-major]
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          github-actions:
              patterns: ['*']
