# action.yml
name: 'TestingBot Tunnel Action'
description: 'A GitHub action to launch the TestingBot Tunnel'
author: Jochen Delabie
branding:
    icon: grid
    color: blue
inputs:
    key:
        description: TestingBot API Key
        required: true
    secret:
        description: TestingBot API Secret
        required: true
    debug:
        description: Enables debug messages. Will output request/response headers.
        required: false
    tbVersion:
        description: "Version (tag) of the testingbot/tunnel Docker image, for example 5.1. Pin a version for reproducible builds."
        required: false
        default: 'latest'
    retryTimeout:
        description: Do not retry if this amount of minutes has passed since starting.
        required: false
        default: '10'
    readyTimeout:
        description: Seconds to wait for the tunnel ready-file after starting the container.
        required: false
        default: '60'
    auth:
        description: "Performs Basic Authentication for specific hosts, only works with HTTP. Format: host:port:user:password, comma separated for several. Passed to the tunnel as an environment variable and masked in logs."
        required: false
    dns:
        description: "Use a custom DNS server. For example: 8.8.8.8"
        required: false
    doctor:
        description: Run the tunnel's diagnostics (--doctor) in a separate container before starting the tunnel and print the result. Never fails the step.
        required: false
    extraHeaders:
        description: "Inject extra headers in the requests the tunnel makes. Value should be a JSON string."
        required: false
    fastFailRegexps:
        description: "Refuse hosts matching these regular expressions, comma separated. Prefix with ! for an exception (tunnel 5.0+), e.g. '.*,!ok\\.com'."
        required: false
    hubPort:
        description: Use this if you want to connect to port 80 on the TestingBot hub instead of the default port 4444.
        required: false
    metricsPort:
        description: Port to expose tunnel metrics on. Default 8003.
        required: false
    noBump:
        description: Do not perform SSL bumping.
        required: false
    noCache:
        description: Bypass TestingBot Caching Proxy running on the tunnel VM.
        required: false
    noProxy:
        description: Do not start a local proxy (requires user provided proxy server on port 8087).
        required: false
    pac:
        description: Proxy autoconfiguration. Should be a http(s) URL
        required: false
    proxy:
        description: "Specify an upstream proxy: PROXYHOST:PROXYPORT"
        required: false
    proxyCredentials:
        description: "Username and password (user:password) required to access the proxy configured with proxy. Passed to the tunnel as an environment variable and masked in logs."
        required: false
    sePort:
        description: The local port your Selenium test should connect to. Default port is 4445
        required: false
    localProxy:
        description: The port to launch the local proxy on (default 8087).
        required: false
    shared:
        description: Share this tunnel with other users in your team. Defaults to private.
        required: false
    tunnelIdentifier:
        description: A unique identifier for the Tunnel
        required: false
    web:
        description: Directory to serve with the tunnel's built-in webserver. Relative paths are resolved against the workspace; the directory is mounted read-only into the container.
        required: false
    bindAddress:
        description: "Interface the tunnel's local listeners (Selenium relay, local proxy, metrics, web) bind to. Defaults to 127.0.0.1. Use 0.0.0.0 only if tests run in another container or machine: the listeners are unauthenticated and the relay attaches your TestingBot credentials."
        required: false
        default: '127.0.0.1'
    allowHosts:
        description: "Only allow the tunnel to reach these hosts, comma separated (*.suffix for subdomains). Everything else is refused with 403. Tunnel 5.0+."
        required: false
    localhostPolicy:
        description: "Set to 'deny' to refuse tunnel traffic to the runner's loopback interface. Tunnel 5.0+."
        required: false
    pacLocal:
        description: "PAC file (path or https URL) the tunnel uses to choose an upstream proxy per destination. Not the same as pac, which configures the remote browser. Tunnel 5.0+."
        required: false
    pacLocalSha256:
        description: SHA-256 the pacLocal document must have (64 hex characters). Required for plain http:// PAC URLs. Tunnel 5.0+.
        required: false
    proxyTestingbot:
        description: "Separate upstream proxy (HOST:PORT) for the tunnel's own connection to TestingBot. Tunnel 5.0+."
        required: false
    proxyTestingbotCredentials:
        description: "Credentials (user:password) for proxyTestingbot. Passed as an environment variable and masked in logs. Tunnel 5.0+."
        required: false
    proxyAuthScheme:
        description: "Authentication scheme for the upstream proxy, e.g. 'negotiate' for Kerberos/SPNEGO. Tunnel 5.0+."
        required: false
    cacertFile:
        description: Extra CA certificate (PEM) to trust, e.g. for a TLS-intercepting proxy. Relative paths are resolved against the workspace. Tunnel 5.0+.
        required: false
    nobumpDomains:
        description: Domains, comma separated, for which SSL bumping is skipped. Tunnel 5.0+.
        required: false
    header:
        description: "Request header rules for plain HTTP traffic, one per line (e.g. 'X-Env: staging' or '-Cookie'). Tunnel 5.0+."
        required: false
    responseHeader:
        description: "Response header rules for plain HTTP traffic, one per line (e.g. '-Content-Security-Policy'). Tunnel 5.0+."
        required: false
    logHttp:
        description: "Per-request logging: none, url, headers or errors (default), optionally per module, e.g. 'proxy:url,forwarder:none'. Tunnel 5.0+."
        required: false
    logFormat:
        description: "Log format: 'text' (default) or 'json'. Tunnel 5.0+."
        required: false
    sshHostKey:
        description: SHA-256 fingerprint the tunnel server's SSH host key must have. Tunnel 5.0+.
        required: false
    sshHostKeyPolicy:
        description: "Set to 'require' to refuse to connect when no host key fingerprint is known. Tunnel 5.0+."
        required: false
    sshConnections:
        description: Number of SSH connections to the tunnel server (1-8, default 4). Tunnel 5.1+.
        required: false
    metricsAuth:
        description: "Basic auth credentials (user:password) for the /metrics endpoint. Passed as an environment variable and masked in logs. Tunnel 4.8+."
        required: false
    extraArgs:
        description: "Additional tunnel command-line options, one per line (e.g. '--http-dial-timeout=10'), for options this action has no input for."
        required: false
    uploadLogFile:
        description: Upload the TestingBot log file as artifact. The log is also uploaded when the tunnel fails to start.
        required: false
        default: 'true'
    logArtifactName:
        description: Name of the uploaded log artifact. Artifact names must be unique per workflow run; set this when using the action in a matrix. If the name is already taken, a unique suffix is added.
        required: false
        default: 'testingbot-tunnel.log'
outputs:
    container-id:
        description: Docker container ID of the running TestingBot Tunnel
    tunnel-identifier:
        description: The tunnel identifier (echoed from the tunnelIdentifier input)
    log-file:
        description: Absolute path to the tunnel log file on the runner
runs:
    using: 'node24'
    main: 'dist/main/index.js'
    post: 'dist/post/index.js'